<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cámaras en vivo de las playas de Galicia">
  <title>WebCams de las Playas de Galicia</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <nav class="nav">
      <div class="nav-container">
        <a href="#" class="nav-brand">
          <div class="brand-icon">
            <i class="bi bi-camera-video-fill"></i>
          </div>
          <div class="brand-text">
            <span class="brand-title">WebCams Galicia</span>
            <span class="brand-subtitle">Playas en directo</span>
          </div>
        </a>
        
        <div class="nav-status">
          <span class="status-dot"></span>
          <span class="status-text">7 cámaras en línea</span>
        </div>
      </div>
    </nav>
  </header>

  <!-- Hero -->
  <section class="hero">
    <div class="hero-content">
      <h1 class="hero-title">Cámaras en vivo de las playas</h1>
      <p class="hero-description">
        Consulta el estado del mar en tiempo real desde las mejores playas de Galicia
      </p>
      <div class="hero-stats">
        <div class="stat">
          <span class="stat-number">7</span>
          <span class="stat-label">Cámaras</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat">
          <span class="stat-number">24/7</span>
          <span class="stat-label">En directo</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat">
          <span class="stat-number">HD</span>
          <span class="stat-label">Calidad</span>
        </div>
      </div>
    </div>
  </section>

  <!-- Grid de cámaras -->
  <main class="main">
    <div class="cameras-grid" id="players-container"></div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-content">
      <p class="footer-text">
        <i class="bi bi-camera-video"></i>
        Streams proporcionados por 
        <a href="https://www.camaramar.com" target="_blank" rel="noopener">Camaramar</a>
      </p>
      <p class="footer-copy">Hecho con <i class="bi bi-heart-fill"></i> en Galicia</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="script.js"></script>
</body>
</html>
